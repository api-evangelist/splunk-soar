note: >-
  Two different things are recorded here. `certifications` are the audited compliance programs Splunk
  publishes for the Splunk SOAR (Cloud) SERVICE — these are searched from Splunk's own service
  description and compliance pages, and they are what the Compliance pointer in apis.yml refers to.
  `standards` are technical/interface standards the SOAR REST API itself conforms to; because Splunk
  publishes no OpenAPI for SOAR, these were assessed against the published REST API reference rather
  than against a spec, and most of them are honest negatives.
