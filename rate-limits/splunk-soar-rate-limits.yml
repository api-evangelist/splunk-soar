performance_guidance:
- guidance: >-
    When creating many artifacts, create the container first, then all artifacts except the last with
    run_automation=False, and the last with run_automation=True — or create the container and its
    artifacts in a single POST and do not set run_automation at all.
  source: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference/container-endpoints/rest-containers
- guidance: >-
    page_size=0 returns every record in one response; the docs warn against it on large data sets.
  source: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference/using-the-splunk-soar-rest-api/query-for-data
- guidance: >-
