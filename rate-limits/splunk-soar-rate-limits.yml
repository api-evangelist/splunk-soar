note: >-
  Splunk publishes no rate limits, quotas, throttling thresholds or rate-limit response headers for
  the Splunk SOAR REST API. The REST API reference, the "Using the Splunk SOAR REST API" section and
  the Splunk SOAR (Cloud) service description were all read on 2026-08-19 and none of them states a
  request ceiling, a window, a burst allowance, an X-RateLimit-*/RateLimit-* header, a Retry-After
  header or a 429 behaviour. This is consistent with the deployment model — SOAR runs on a
  single-tenant host (customer-hosted on-premises, or a dedicated SOAR Cloud tenant), so throughput
  is bounded by the tenant's own capacity rather than by a shared multi-tenant quota. The docs
  instead give performance ADVICE, captured below, which is not the same thing as a published limit.
  An agent cannot read a runtime backpressure signal from this API.
limits: []
