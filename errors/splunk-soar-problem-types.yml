  status: non-200
  title: Duplicate container
  envelope: '{"existing_container_id": <int>, "failed": true, "message": "duplicate with..."}'
  remediation: >-
    A container with the same source_data_identifier already exists. Use the returned
    existing_container_id rather than retrying the create.
  source: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference/container-endpoints/rest-containers
- id: delete-requires-user-auth
  status: non-200
  title: Delete rejected for token authentication
  envelope: '{"failed": true, "message": "<error description>"}'
  remediation: >-
    DELETE requires user-account (HTTP Basic) authentication. The ph-auth-token automation token is
    not accepted for deletes — re-issue the call with user credentials.
  source: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference/using-the-splunk-soar-rest-api/delete-records
