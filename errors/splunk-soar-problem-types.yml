  title: Request failed
  envelope: '{"failed": true, "message": "<error description>"}'
  remediation: >-
    Read the message string. SOAR does not return a stable machine-readable error code, so clients
    must branch on the presence of the "failed" key and, where they need finer handling, on
    substrings of "message" — which is not a stable contract.
  source: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference/using-the-splunk-soar-rest-api/delete-records
