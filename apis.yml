apis:
- aid: splunk-soar:splunk-soar-rest-api
  name: Splunk SOAR REST API
  description: The Splunk SOAR REST API creates, updates, queries and selectively removes the objects the platform
    automates against — containers, artifacts, playbooks, action runs, apps, assets, CEF fields, indicators,
    evidence, notes, vault files, workbooks, custom lists, custom functions, roles, users, severities, aggregation
    rules, approvals, multi-tenancy and system settings. Requests must be made over HTTPS against the customer's own
    SOAR tenant.
  humanURL: https://help.splunk.com/en/splunk-soar/soar-cloud/rest-api-reference
  baseURL: https://{soar-host}/rest
