aid: splunk-soar
name: Splunk SOAR
description: Splunk SOAR, built on the Phantom platform Splunk acquired in 2018 and now part of Cisco through the
  2024 Splunk acquisition, is a security orchestration, automation and response platform. It runs playbooks across
  hundreds of connected security tools, and exposes a REST API for containers, artifacts, playbooks, actions,
  assets, indicators, evidence, vault files, workbooks and case management, served from each customer's own tenant
  at https://{soar-host}/rest/ rather than a shared API host. Authentication is HTTP Basic or a ph-auth-token
  automation token. Splunk publishes a documented app/connector SDK on PyPI with the soarapps CLI, a first-party VS
  Code extension, and 529 open connector repositories, but no anonymously fetchable OpenAPI document, no MCP server
  for SOAR, and no published rate limits or pricing.
