aid: splunk-soar
name: Splunk SOAR
description: Splunk SOAR, built on the Phantom platform Splunk acquired in 2018 and now part of Cisco through the
  2024 Splunk acquisition, is a security orchestration, automation and response platform. It runs playbooks across
  hundreds of connected security tools, and exposes a REST API for containers, artifacts, playbooks, actions and
  case management, plus a documented app/connector SDK. Splunk publishes a VS Code extension and a pytest harness
  for connector development, but no anonymously fetchable OpenAPI document.
